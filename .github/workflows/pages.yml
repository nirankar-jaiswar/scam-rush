name: Deploy game to GitHub Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate static game
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const vm = require("node:vm");
          const html = fs.readFileSync("index.html", "utf8");
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];

          if (scripts.length !== 1) {
            throw new Error(`Expected one inline game script, found ${scripts.length}`);
          }
          new vm.Script(scripts[0][1], { filename: "index.html inline script" });
          if (!html.includes("Scam Rush — Catch the Phish!")) {
            throw new Error("Game page title is missing");
          }
          console.log("Static game HTML and inline JavaScript are valid.");
          NODE

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
